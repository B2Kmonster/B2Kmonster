<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450">
  <defs>
    <!-- Black + Green + Red Master Background -->
    <linearGradient id="bg-matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020403"/>
      <stop offset="50%" stop-color="#0A0F0D"/>
      <stop offset="100%" stop-color="#050203"/>
    </linearGradient>

    <!-- Green to Red Accent Gradient -->
    <linearGradient id="accent-green-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66; #FF0055; #00FF66" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E; #EF4444; #22C55E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055; #00FF66; #FF0055" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Border Shimmer (Green & Red) -->
    <linearGradient id="border-matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 102, 0.7)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 0, 85, 0.7)"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-green-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF66" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-red-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF0055" flood-opacity="0.6"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Radial Background Glows -->
    <radialGradient id="glow-green-blob" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-red-blob" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes laserSweep { 0% { transform: translateY(0px); } 100% { transform: translateY(450px); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1.0; } }
    @keyframes hudRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .cursor-blink { animation: blink 0.8s infinite; }
    .laser-beam { animation: laserSweep 5s linear infinite; }
    .bg-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .hud-ring { transform-origin: 170px 180px; animation: hudRotate 15s linear infinite; }
  </style>

  <!-- Outer Canvas Container -->
  <rect x="0" y="0" width="1180" height="450" rx="16" fill="url(#bg-matrix)" stroke="url(#border-matrix)" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Background Pulsing Radial Glows -->
  <g class="bg-pulse">
    <circle cx="180" cy="120" r="280" fill="url(#glow-green-blob)"/>
    <circle cx="1000" cy="330" r="300" fill="url(#glow-red-blob)"/>
  </g>

  <!-- Matrix Digital Grid Pattern -->
  <g fill="rgba(0, 255, 102, 0.08)">
    <circle cx="100" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="500" cy="60" r="1.5"/><circle cx="600" cy="60" r="1.5"/><circle cx="700" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/><circle cx="900" cy="60" r="1.5"/><circle cx="1000" cy="60" r="1.5"/><circle cx="1100" cy="60" r="1.5"/>
    <circle cx="100" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="300" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="500" cy="160" r="1.5"/><circle cx="600" cy="160" r="1.5"/><circle cx="700" cy="160" r="1.5"/><circle cx="800" cy="160" r="1.5"/><circle cx="900" cy="160" r="1.5"/><circle cx="1000" cy="160" r="1.5"/><circle cx="1100" cy="160" r="1.5"/>
    <circle cx="100" cy="260" r="1.5"/><circle cx="200" cy="260" r="1.5"/><circle cx="300" cy="260" r="1.5"/><circle cx="400" cy="260" r="1.5"/><circle cx="500" cy="260" r="1.5"/><circle cx="600" cy="260" r="1.5"/><circle cx="700" cy="260" r="1.5"/><circle cx="800" cy="260" r="1.5"/><circle cx="900" cy="260" r="1.5"/><circle cx="1000" cy="260" r="1.5"/><circle cx="1100" cy="260" r="1.5"/>
    <circle cx="100" cy="360" r="1.5"/><circle cx="200" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/><circle cx="400" cy="360" r="1.5"/><circle cx="500" cy="360" r="1.5"/><circle cx="600" cy="360" r="1.5"/><circle cx="700" cy="360" r="1.5"/><circle cx="800" cy="360" r="1.5"/><circle cx="900" cy="360" r="1.5"/><circle cx="1000" cy="360" r="1.5"/><circle cx="1100" cy="360" r="1.5"/>
  </g>
  <g fill="rgba(255, 0, 85, 0.08)">
    <circle cx="150" cy="110" r="1.5"/><circle cx="250" cy="110" r="1.5"/><circle cx="350" cy="110" r="1.5"/><circle cx="450" cy="110" r="1.5"/><circle cx="550" cy="110" r="1.5"/><circle cx="650" cy="110" r="1.5"/><circle cx="750" cy="110" r="1.5"/><circle cx="850" cy="110" r="1.5"/><circle cx="950" cy="110" r="1.5"/><circle cx="1050" cy="110" r="1.5"/>
    <circle cx="150" cy="210" r="1.5"/><circle cx="250" cy="210" r="1.5"/><circle cx="350" cy="210" r="1.5"/><circle cx="450" cy="210" r="1.5"/><circle cx="550" cy="210" r="1.5"/><circle cx="650" cy="210" r="1.5"/><circle cx="750" cy="210" r="1.5"/><circle cx="850" cy="210" r="1.5"/><circle cx="950" cy="210" r="1.5"/><circle cx="1050" cy="210" r="1.5"/>
  </g>

  <!-- Green Laser Scanning Line -->
  <rect x="0" y="0" width="1180" height="4" fill="rgba(0, 255, 102, 0.3)" class="laser-beam" filter="url(#glow-green-filter)"/>

  <!-- ======================================================== -->
  <!-- LEFT PANEL: MATRIX CYBER HUD SKULL (~30%)               -->
  <!-- ======================================================== -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="340" height="402" rx="12" fill="#060A08" fill-opacity="0.9" stroke="rgba(0, 255, 102, 0.3)" stroke-width="1.2"/>
    
    <!-- Window Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 328 0 C 334.63 0 340 5.37 340 12 L 340 38 L 0 38 Z" fill="#0D1410"/>
    <circle cx="18" cy="19" r="5" fill="#FF0055"/>
    <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="19" r="5" fill="#00FF66"/>
    <text x="170" y="23" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700">b2kmonster@matrix:~</text>
    <line x1="0" y1="38" x2="340" y2="38" stroke="rgba(0, 255, 102, 0.2)"/>

    <!-- Central Cyber Emblem: Animated Vector Cyber Skull & HUD -->
