<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430">
  <defs>
    <!-- Master Dark Background -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.5)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.5)"/>
    </linearGradient>

    <!-- Radial Background Glows -->
    <radialGradient id="glow-purple" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
    @keyframes scanline { 0% { transform: translateY(0px); } 100% { transform: translateY(430px); } }

    .cursor-blink { animation: blink 0.9s infinite; }
    .bg-pulse { animation: pulseGlow 5s ease-in-out infinite; }
    .scan-beam { animation: scanline 7s linear infinite; }
  </style>

  <!-- Outer Card Container -->
  <rect x="0" y="0" width="1180" height="430" rx="16" fill="url(#bg-dark)" stroke="url(#border-dark)" stroke-width="1.5" filter="url(#shadow-dark)"/>

  <!-- Background Glow Blobs -->
  <g class="bg-pulse">
    <circle cx="180" cy="120" r="260" fill="url(#glow-purple)"/>
    <circle cx="1000" cy="320" r="280" fill="url(#glow-cyan)"/>
  </g>

  <!-- Subtle Dot Grid Background -->
  <g fill="rgba(255, 255, 255, 0.05)">
    <circle cx="100" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="500" cy="60" r="1.5"/><circle cx="600" cy="60" r="1.5"/><circle cx="700" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/><circle cx="900" cy="60" r="1.5"/><circle cx="1000" cy="60" r="1.5"/><circle cx="1100" cy="60" r="1.5"/>
    <circle cx="100" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="300" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="500" cy="160" r="1.5"/><circle cx="600" cy="160" r="1.5"/><circle cx="700" cy="160" r="1.5"/><circle cx="800" cy="160" r="1.5"/><circle cx="900" cy="160" r="1.5"/><circle cx="1000" cy="160" r="1.5"/><circle cx="1100" cy="160" r="1.5"/>
    <circle cx="100" cy="260" r="1.5"/><circle cx="200" cy="260" r="1.5"/><circle cx="300" cy="260" r="1.5"/><circle cx="400" cy="260" r="1.5"/><circle cx="500" cy="260" r="1.5"/><circle cx="600" cy="260" r="1.5"/><circle cx="700" cy="260" r="1.5"/><circle cx="800" cy="260" r="1.5"/><circle cx="900" cy="260" r="1.5"/><circle cx="1000" cy="260" r="1.5"/><circle cx="1100" cy="260" r="1.5"/>
    <circle cx="100" cy="360" r="1.5"/><circle cx="200" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/><circle cx="400" cy="360" r="1.5"/><circle cx="500" cy="360" r="1.5"/><circle cx="600" cy="360" r="1.5"/><circle cx="700" cy="360" r="1.5"/><circle cx="800" cy="360" r="1.5"/><circle cx="900" cy="360" r="1.5"/><circle cx="1000" cy="360" r="1.5"/><circle cx="1100" cy="360" r="1.5"/>
  </g>

  <!-- Scanline Beam -->
  <rect x="0" y="0" width="1180" height="4" fill="rgba(6, 182, 212, 0.2)" class="scan-beam"/>

  <!-- ======================================================== -->
  <!-- LEFT HUD PANEL: CYBER SECURITY EMBLEM                   -->
  <!-- ======================================================== -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="340" height="382" rx="12" fill="#0F172A" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
    
    <!-- Panel Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 328 0 C 334.63 0 340 5.37 340 12 L 340 38 L 0 38 Z" fill="rgba(15, 23, 42, 0.95)"/>
    <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="19" r="5" fill="#27C93F"/>
    <text x="170" y="23" text-anchor="middle" fill="#94A3B8" class="mono" font-size="11" font-weight="600">b2kmonster@cyber:~</text>
    <line x1="0" y1="38" x2="340" y2="38" stroke="rgba(255, 255, 255, 0.08)"/>

    <!-- Central Cyber Emblem Graphic (Pixel-Perfect Vector Shield HUD) -->
    <g transform="translate(170, 170)">
      <!-- Outer Rotating Rings -->
      <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>
      <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" stroke-dasharray="12 4"/>

      <!-- Vector Shield Icon -->
      <path d="M 0 -38 L 30 -22 L 30 10 C 30 30 0 45 0 45 C 0 45 -30 30 -30 10 L -30 -22 Z" fill="none" stroke="url(#accent-dark)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 0 -26 L 20 -14 L 20 8 C 20 22 0 32 0 32 C 0 32 -20 22 -20 8 L -20 -14 Z" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1.5"/>

      <!-- Lock Keyhole Motif inside Shield -->
      <circle cx="0" cy="-3" r="6" fill="#10B981"/>
      <polygon points="-4, -1 4, -1 6, 14 -6, 14" fill="#10B981"/>
    </g>

    <!-- Status Output at Bottom -->
    <g transform="translate(20, 310)" class="mono" font-size="11">
      <text x="0" y="0" fill="#94A3B8">STATUS : <tspan fill="#10B981" font-weight="700">● ONLINE</tspan></text>
      <text x="0" y="20" fill="#94A3B8">TARGET : <tspan fill="#06B6D4">AI SOC &amp; PENTEST LAB</tspan></text>
      <text x="0" y="40" fill="#6366F1" font-weight="700">&gt;_ ./init_profile.sh<tspan fill="#06B6D4" class="cursor-blink"> █</tspan></text>
    </g>
  </g>

