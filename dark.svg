        </g>
      </g>

      <line x1="0" y1="202" x2="712" y2="202" stroke="rgba(255, 255, 255, 0.08)"/>

      <!-- Tech Skills Grid -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#94A3B8" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">// TECH &amp; SECURITY STACK</text>
        
        <g transform="translate(0, 14)">
          <!-- Python -->
          <rect x="0" y="0" width="76" height="26" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
          <text x="38" y="17" text-anchor="middle" fill="#A5B4FC" class="mono" font-size="11" font-weight="600">Python</text>

          <!-- Pentesting -->
          <rect x="84" y="0" width="94" height="26" rx="6" fill="#1E293B" stroke="#7C3AED" stroke-width="1"/>
          <text x="131" y="17" text-anchor="middle" fill="#C084FC" class="mono" font-size="11" font-weight="600">Pentesting</text>

          <!-- Burp Suite -->
          <rect x="186" y="0" width="94" height="26" rx="6" fill="#1E293B" stroke="#F97316" stroke-width="1"/>
          <text x="233" y="17" text-anchor="middle" fill="#FDBA74" class="mono" font-size="11" font-weight="600">Burp Suite</text>

          <!-- AI Security -->
          <rect x="288" y="0" width="96" height="26" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
          <text x="336" y="17" text-anchor="middle" fill="#67E8F9" class="mono" font-size="11" font-weight="600">AI Security</text>

          <!-- Wazuh SIEM -->
          <rect x="392" y="0" width="102" height="26" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
          <text x="443" y="17" text-anchor="middle" fill="#6EE7B7" class="mono" font-size="11" font-weight="600">Wazuh SIEM</text>

          <!-- Docker -->
          <rect x="502" y="0" width="72" height="26" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
          <text x="538" y="17" text-anchor="middle" fill="#93C5FD" class="mono" font-size="11" font-weight="600">Docker</text>

          <!-- Linux -->
          <rect x="582" y="0" width="62" height="26" rx="6" fill="#1E293B" stroke="#EAB308" stroke-width="1"/>
          <text x="613" y="17" text-anchor="middle" fill="#FDE047" class="mono" font-size="11" font-weight="600">Linux</text>
        </g>
      </g>

      <!-- Footer Badges -->
