          <text x="145" y="0" fill="#F8FAFC">B.E. Computer Science Engineering (Grad 2027)</text>
        </g>
        <!-- Row 3: Credentials -->
        <g transform="translate(0, 52)">
          <text x="0" y="0" fill="#10B981" font-weight="600">🎯  Credentials :</text>
          <text x="145" y="0" fill="#F8FAFC">CEH Certified • Pentesting • Reverse Engineering</text>
        </g>
        <!-- Row 4: Focus -->
        <g transform="translate(0, 78)">
          <text x="0" y="0" fill="#F59E0B" font-weight="600">⚡  Current Focus:</text>
