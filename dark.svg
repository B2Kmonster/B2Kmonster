        <line x1="0" y1="0" x2="712" y2="0" stroke="rgba(255, 255, 255, 0.08)"/>
        <g transform="translate(0, 12)" class="sans" font-size="12" font-weight="600">
          <text x="0" y="14" fill="#94A3B8">GitHub: <tspan fill="#F8FAFC">@B2Kmonster</tspan></text>
          <text x="210" y="14" fill="#94A3B8">LinkedIn: <tspan fill="#F8FAFC">bhuvan-kumar-hm</tspan></text>
          <text x="450" y="14" fill="#94A3B8">Email: <tspan fill="#06B6D4">bhuvankumarhm25@gmail.com</tspan></text>
