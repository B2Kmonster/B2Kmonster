    <circle cx="18" cy="19" r="5" fill="#FF0055"/>
    <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="19" r="5" fill="#00FF66"/>
    <text x="384" y="23" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700">~/bhuvan-kumar-hm/profile.sh</text>
    <line x1="0" y1="38" x2="768" y2="38" stroke="rgba(0, 255, 102, 0.2)"/>

    <!-- Content Area -->
    <g transform="translate(28, 55)">
      
      <!-- Greeting Header -->
      <text x="0" y="22" fill="#94A3B8" class="sans" font-size="15" font-weight="600">Hi 👋, I'm</text>
      <text x="86" y="24" fill="url(#accent-green-red)" class="sans" font-size="25" font-weight="900" letter-spacing="0.8">BHUVAN KUMAR H M</text>
      
      <!-- Tagline -->
      <text x="0" y="55" fill="#00FF66" class="mono" font-size="14.5" font-weight="700">&gt; Cybersecurity Engineer <tspan fill="#FF0055">|</tspan> Penetration Tester <tspan fill="#FF0055">|</tspan> <tspan fill="#FF0055" font-weight="800">CEH</tspan></text>

      <line x1="0" y1="72" x2="712" y2="72" stroke="rgba(0, 255, 102, 0.2)"/>

      <!-- Clean Metadata List -->
      <g transform="translate(0, 98)" class="mono" font-size="13">
        <!-- Row 1: Location -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#00FF66" font-weight="700">📍  Location    :</text>
          <text x="145" y="0" fill="#F8FAFC" font-weight="600">Karnataka, India</text>
        </g>
        <!-- Row 2: Education -->
        <g transform="translate(0, 28)">
          <text x="0" y="0" fill="#00FF66" font-weight="700">🎓  Education   :</text>
          <text x="145" y="0" fill="#F8FAFC" font-weight="600">B.E. Computer Science Engineering (Grad 2027)</text>
        </g>
        <!-- Row 3: Credentials -->
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#FF0055" font-weight="700">🎯  Credentials :</text>
          <text x="145" y="0" fill="#F8FAFC" font-weight="600">Certified Ethical Hacker (CEH) • Pentesting • Reverse Eng</text>
        </g>
        <!-- Row 4: Focus -->
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#FF0055" font-weight="700">⚡  Current Focus:</text>
          <text x="145" y="0" fill="#F8FAFC" font-weight="600">AI Security Research, DuckyBuilder &amp; SOC Automation</text>
        </g>
      </g>

      <line x1="0" y1="212" x2="712" y2="212" stroke="rgba(0, 255, 102, 0.2)"/>

      <!-- Glowing Skill Pills Section -->
      <g transform="translate(0, 232)">
        <text x="0" y="0" fill="#00FF66" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">// CORE TECH &amp; RED TEAM STACK</text>
        
        <g transform="translate(0, 14)">
          <!-- Python -->
          <rect x="0" y="0" width="76" height="26" rx="6" fill="#05140A" stroke="#00FF66" stroke-width="1.2"/>
          <text x="38" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700">Python</text>

          <!-- Pentesting -->
          <rect x="84" y="0" width="94" height="26" rx="6" fill="#140509" stroke="#FF0055" stroke-width="1.2"/>
          <text x="131" y="17" text-anchor="middle" fill="#FF0055" class="mono" font-size="11" font-weight="700">Pentesting</text>

          <!-- Burp Suite -->
          <rect x="186" y="0" width="94" height="26" rx="6" fill="#140509" stroke="#FF0055" stroke-width="1.2"/>
          <text x="233" y="17" text-anchor="middle" fill="#FF0055" class="mono" font-size="11" font-weight="700">Burp Suite</text>

          <!-- AI Security -->
          <rect x="288" y="0" width="96" height="26" rx="6" fill="#05140A" stroke="#00FF66" stroke-width="1.2"/>
          <text x="336" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700">AI Security</text>

          <!-- Wazuh SIEM -->
          <rect x="392" y="0" width="102" height="26" rx="6" fill="#05140A" stroke="#00FF66" stroke-width="1.2"/>
