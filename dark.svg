      <!-- Animated Rotating HUD Ring -->
      <circle cx="0" cy="0" r="85" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="10 8" class="hud-ring"/>
      <circle cx="0" cy="0" r="70" fill="none" stroke="#FF0055" stroke-width="1.5" stroke-dasharray="6 6"/>

      <!-- Glowing Matrix Target Crosshairs -->
      <line x1="-95" y1="0" x2="-65" y2="0" stroke="#00FF66" stroke-width="2"/>
      <line x1="65" y1="0" x2="95" y2="0" stroke="#00FF66" stroke-width="2"/>
      <line x1="0" y1="-95" x2="0" y2="-65" stroke="#00FF66" stroke-width="2"/>
      <line x1="0" y1="65" x2="0" y2="95" stroke="#00FF66" stroke-width="2"/>

      <!-- Vector Cyber Hacker Emblem -->
      <!-- Visor Outer -->
      <polygon points="-35,-25 35,-25 45,-5 25,25 -25,25 -45,-5" fill="none" stroke="#00FF66" stroke-width="2.5" filter="url(#glow-green-filter)"/>
      <!-- Glowing Red Eyes Visor -->
      <polygon points="-28,-15 28,-15 35,-2 20,12 -20,12 -35,-2" fill="#FF0055" fill-opacity="0.8" stroke="#FF0055" stroke-width="1.5" filter="url(#glow-red-filter)"/>
      <!-- Cyber Teeth Grid -->
      <path d="M -15 25 L -15 38 M -5 25 L -5 38 M 5 25 L 5 38 M 15 25 L 15 38" stroke="#00FF66" stroke-width="2"/>
    </g>

    <!-- Status Block -->
