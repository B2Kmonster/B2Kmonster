      <text x="0" y="0" fill="#94A3B8">SYSTEM : <tspan fill="#00FF66" font-weight="700" filter="url(#glow-green-filter)">● ONLINE [MATRIX]</tspan></text>
      <text x="0" y="20" fill="#94A3B8">RED TEAM: <tspan fill="#FF0055" font-weight="700" filter="url(#glow-red-filter)">EXPLOIT OPS ACTIVE</tspan></text>
      <text x="0" y="40" fill="#00FF66" font-weight="700">&gt;_ ./pwn_the_box.sh<tspan fill="#FF0055" class="cursor-blink"> █</tspan></text>
    </g>
  </g>

