          <!-- Docker -->
          <rect x="502" y="0" width="72" height="26" rx="6" fill="#05140A" stroke="#00FF66" stroke-width="1.2"/>
          <text x="538" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700">Docker</text>

          <!-- Kali Linux -->
