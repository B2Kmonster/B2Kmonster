        <g transform="translate(0, 14)" class="mono" font-size="11" font-weight="800">
          <text x="0" y="14" fill="#94A3B8">DEFCON_ID: <tspan fill="#FF003C">157491016</tspan></text>
          <text x="170" y="14" fill="#94A3B8">GH: <tspan fill="#FCEE09">@B2Kmonster</tspan></text>
          <text x="330" y="14" fill="#94A3B8">IN: <tspan fill="#FCEE09">bhuvan-kumar-hm</tspan></text>
          <text x="520" y="14" fill="#94A3B8">EMAIL: <tspan fill="#00FF66">bhuvankumarhm25@gmail.com</tspan></text>
