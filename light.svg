          <text x="245" y="17" text-anchor="middle" fill="#FF003C" class="mono" font-size="10.5" font-weight="800">▶ Burp Suite</text>

          <!-- AI Security -->
          <polygon points="302,0 394,0 402,8 402,26 310,26 302,18" fill="#041A0E" stroke="#00FF66" stroke-width="1.2"/>
          <text x="352" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="10.5" font-weight="800">▶ AI Security</text>

          <!-- Wazuh SIEM -->
