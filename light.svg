    <text x="381" y="21" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700" letter-spacing="1">[ DATASTREAM // BHUVAN_KUMAR_HM ]</text>
    <line x1="0" y1="34" x2="762" y2="34" stroke="rgba(0, 255, 102, 0.25)"/>

    <!-- Content Area -->
    <g transform="translate(28, 52)">
      
      <!-- Name Header with Cyber Glow -->
      <text x="0" y="22" fill="#94A3B8" class="sans" font-size="15" font-weight="600">Hi 👋, I'm</text>
      <text x="86" y="24" fill="url(#cyber-neon-grad-light)" class="sans glitch-effect" font-size="26" font-weight="900" letter-spacing="1">BHUVAN KUMAR H M</text>
      
      <!-- Role Tagline -->
      <text x="0" y="55" fill="#00FF66" class="mono" font-size="14" font-weight="700">&gt; CYBERSECURITY ENG <tspan fill="#FF0055">|</tspan> PENETRATION TESTER <tspan fill="#FF0055">|</tspan> <tspan fill="#FF0055" font-weight="900">CEH</tspan> <tspan fill="#FF0055">|</tspan> <tspan fill="#00F0FF">AI SECURITY</tspan></text>

      <line x1="0" y1="70" x2="706" y2="70" stroke="rgba(0, 255, 102, 0.25)"/>

      <!-- Clean Non-Overlapping Metadata List -->
      <g transform="translate(0, 96)" class="mono" font-size="13">
        <!-- Row 1: Location -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#00FF66" font-weight="800">[LOC]</text>
          <text x="52" y="0" fill="#00F0FF" font-weight="700">Location    :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">Karnataka, India</text>
        </g>
        <!-- Row 2: Education -->
        <g transform="translate(0, 28)">
          <text x="0" y="0" fill="#00FF66" font-weight="800">[EDU]</text>
          <text x="52" y="0" fill="#00F0FF" font-weight="700">Education   :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">B.E. Computer Science Engineering (Grad 2027)</text>
        </g>
        <!-- Row 3: Credentials -->
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#FF0055" font-weight="800">[SEC]</text>
          <text x="52" y="0" fill="#FF0055" font-weight="700">Credentials :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">CEH Certified • Pentesting • Reverse Engineering</text>
        </g>
        <!-- Row 4: Focus -->
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#FF0055" font-weight="800">[FOC]</text>
          <text x="52" y="0" fill="#FF0055" font-weight="700">Current Focus:</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">AI Security Research, DuckyBuilder &amp; SOC Automation</text>
        </g>
      </g>

      <line x1="0" y1="210" x2="706" y2="210" stroke="rgba(0, 255, 102, 0.25)"/>

      <!-- Angular Cyberpunk Tech Badges -->
      <g transform="translate(0, 230)">
        <text x="0" y="0" fill="#00FF66" class="mono" font-size="11" font-weight="800" letter-spacing="1.5">// EXPLOIT_STACK &amp; TOOLKIT</text>
        
        <g transform="translate(0, 14)">
          <!-- Python -->
          <polygon points="0,0 72,0 80,8 80,26 8,26 0,18" fill="#061A0F" stroke="#00FF66" stroke-width="1.2"/>
          <text x="40" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="10.5" font-weight="800">▶ Python</text>

          <!-- Pentesting -->
          <polygon points="88,0 180,0 188,8 188,26 96,26 88,18" fill="#1C060D" stroke="#FF0055" stroke-width="1.2"/>
          <text x="138" y="17" text-anchor="middle" fill="#FF0055" class="mono" font-size="10.5" font-weight="800">▶ Pentesting</text>

          <!-- Burp Suite -->
          <polygon points="196,0 286,0 294,8 294,26 204,26 196,18" fill="#1C060D" stroke="#FF0055" stroke-width="1.2"/>
          <text x="245" y="17" text-anchor="middle" fill="#FF0055" class="mono" font-size="10.5" font-weight="800">▶ Burp Suite</text>

          <!-- AI Security -->
          <polygon points="302,0 394,0 402,8 402,26 310,26 302,18" fill="#061A0F" stroke="#00FF66" stroke-width="1.2"/>
          <text x="352" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="10.5" font-weight="800">▶ AI Security</text>

          <!-- Wazuh SIEM -->
          <polygon points="410,0 508,0 516,8 516,26 418,26 410,18" fill="#061A0F" stroke="#00FF66" stroke-width="1.2"/>
          <text x="463" y="17" text-anchor="middle" fill="#00FF66" class="mono" font-size="10.5" font-weight="800">▶ Wazuh SIEM</text>

          <!-- Docker -->
          <polygon points="524,0 594,0 602,8 602,26 532,26 524,18" fill="#06181C" stroke="#00F0FF" stroke-width="1.2"/>
          <text x="563" y="17" text-anchor="middle" fill="#00F0FF" class="mono" font-size="10.5" font-weight="800">▶ Docker</text>

          <!-- Kali Linux -->
          <polygon points="610,0 698,0 706,8 706,26 618,26 610,18" fill="#1C060D" stroke="#FF0055" stroke-width="1.2"/>
          <text x="658" y="17" text-anchor="middle" fill="#FF0055" class="mono" font-size="10.5" font-weight="800">▶ Kali Linux</text>
        </g>
      </g>

      <!-- Footer Telemetry & Handles -->
      <g transform="translate(0, 302)">
        <line x1="0" y1="0" x2="706" y2="0" stroke="rgba(0, 255, 102, 0.25)"/>
        <g transform="translate(0, 14)" class="mono" font-size="11" font-weight="700">
          <text x="0" y="14" fill="#94A3B8">SYS_ID: <tspan fill="#00FF66">157491016</tspan></text>
          <text x="145" y="14" fill="#94A3B8">GH: <tspan fill="#00FF66">@B2Kmonster</tspan></text>
          <text x="310" y="14" fill="#94A3B8">IN: <tspan fill="#00FF66">bhuvan-kumar-hm</tspan></text>
          <text x="500" y="14" fill="#94A3B8">EMAIL: <tspan fill="#FF0055">bhuvankumarhm25@gmail.com</tspan></text>
        </g>
