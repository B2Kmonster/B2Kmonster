        <line x1="0" y1="0" x2="712" y2="0" stroke="#E2E8F0"/>
        <g transform="translate(0, 12)" class="sans" font-size="12" font-weight="600">
          <text x="0" y="14" fill="#475569">GitHub: <tspan fill="#0F172A" font-weight="700">@B2Kmonster</tspan></text>
          <text x="210" y="14" fill="#475569">LinkedIn: <tspan fill="#0F172A" font-weight="700">bhuvan-kumar-hm</tspan></text>
          <text x="450" y="14" fill="#475569">Email: <tspan fill="#1D4ED8" font-weight="700">bhuvankumarhm25@gmail.com</tspan></text>
