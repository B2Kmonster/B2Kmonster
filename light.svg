<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470">
  <defs>
    <!-- Black + Red + Yellow Master Background (NO BLUE) -->
    <linearGradient id="bg-defcon-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020102"/>
      <stop offset="50%" stop-color="#0F0507"/>
      <stop offset="100%" stop-color="#020102"/>
    </linearGradient>

    <!-- Red to Yellow Accent Gradient -->
    <linearGradient id="accent-red-yellow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C">
        <animate attributeName="stop-color" values="#FF003C; #FCEE09; #00FF66; #FF003C" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FCEE09">
        <animate attributeName="stop-color" values="#FCEE09; #00FF66; #FF003C; #FCEE09" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66; #FF003C; #FCEE09; #00FF66" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Border Shimmer Gradient (Red & Yellow) -->
    <linearGradient id="border-defcon-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C"/>
      <stop offset="50%" stop-color="#FCEE09"/>
      <stop offset="100%" stop-color="#FF003C"/>
    </linearGradient>

    <!-- High-Intensity Red DEFCON Glow Filter -->
    <filter id="glow-red-intense-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-yellow-intense-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="defcon-shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Radial Background Glows -->
    <radialGradient id="blob-red-defcon-light" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-yellow-defcon-light" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#FCEE09" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FCEE09" stop-opacity="0"/>
    </radialGradient>

    <!-- Hex Mesh Pattern -->
    <pattern id="hex-defcon-light" width="24" height="41.569" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6.928 L 24 20.785 L 12 27.713 L 0 20.785 L 0 6.928 Z M 0 41.569 L 12 34.641 L 24 41.569" fill="none" stroke="rgba(255, 0, 60, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes laserSweep { 0% { transform: translateY(0px); } 100% { transform: translateY(470px); } }
    @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1.0; } }
    @keyframes skullPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    .cursor-blink { animation: blink 0.8s infinite; }
    .laser-beam { animation: laserSweep 4.5s linear infinite; }
    .hud-cw { transform-origin: 175px 175px; animation: rotateClockwise 16s linear infinite; }
    .hud-ccw { transform-origin: 175px 175px; animation: rotateCounter 10s linear infinite; }
    .bg-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .skull-anim { transform-origin: 175px 175px; animation: skullPulse 3s ease-in-out infinite; }
  </style>

  <!-- Outer Chamfered Container -->
  <polygon points="0,20 20,0 1160,0 1180,20 1180,450 1160,470 20,470 0,450" fill="url(#bg-defcon-light)" stroke="url(#border-defcon-light)" stroke-width="2" filter="url(#defcon-shadow-light)"/>

  <!-- Hexagonal Grid Overlay -->
  <rect x="0" y="0" width="1180" height="470" fill="url(#hex-defcon-light)"/>

  <!-- Pulsing Background Glow Blobs -->
  <g class="bg-pulse">
    <circle cx="180" cy="120" r="280" fill="url(#blob-red-defcon-light)"/>
    <circle cx="1000" cy="340" r="300" fill="url(#blob-yellow-defcon-light)"/>
  </g>

  <!-- Top Yellow/Red Ticker Banner -->
  <polygon points="0,0 1180,0 1180,22 0,22" fill="#FF003C"/>
  <g transform="translate(24, 15)" class="mono" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">
    <text x="0" y="0">// DEFCON RED TEAM OPERATIONAL NODE // AGENT: B2KMONSTER // SURRENDER NOTHING // 0x7F_SEC</text>
    <text x="1132" y="0" text-anchor="end" fill="#FCEE09">● THREAT LEVEL: DEFCON 1</text>
  </g>

  <!-- Crimson Laser Scan Sweep -->
  <rect x="0" y="22" width="1180" height="3" fill="#FF003C" opacity="0.9" class="laser-beam" filter="url(#glow-red-intense-light)"/>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: DEFCON RED SKULL LOGO PANEL (~30%)           -->
  <!-- ======================================================== -->
  <g transform="translate(24, 38)">
    <polygon points="0,12 12,0 338,0 350,12 350,396 338,408 12,408 0,396" fill="#0A0305" fill-opacity="0.95" stroke="#FF003C" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <polygon points="0,12 12,0 338,0 350,12 350,34 0,34" fill="#FF003C"/>
    <circle cx="18" cy="17" r="4.5" fill="#FCEE09"/>
    <circle cx="32" cy="17" r="4.5" fill="#00FF66"/>
    <circle cx="46" cy="17" r="4.5" fill="#000000"/>
    <text x="175" y="21" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="11" font-weight="900" letter-spacing="1">[ DEFCON_RED_SKULL ]</text>
    <line x1="0" y1="34" x2="350" y2="34" stroke="#FF003C"/>

    <!-- ======================================================== -->
    <!-- DEFCON LOGO GRAPHIC (RED SKULL + CROSSED DAGGER BLADES)  -->
    <!-- ======================================================== -->
    <g transform="translate(0, 0)">
      
      <!-- Animated Rotating Outer Target Rings (NO BLUE, RED & YELLOW ONLY) -->
      <g class="hud-cw">
        <circle cx="175" cy="175" r="82" fill="none" stroke="#FCEE09" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.7"/>
      </g>
      <g class="hud-ccw">
        <circle cx="175" cy="175" r="70" fill="none" stroke="#FF003C" stroke-width="2" stroke-dasharray="18 6" opacity="0.85"/>
      </g>

      <!-- Animated DEFCON Red Skull Container -->
      <g class="skull-anim" filter="url(#glow-red-intense-light)">
        
        <!-- CROSSED DAGGER BLADES (BEHIND CIRCLE) -->
        <!-- Left Dagger (Top-Left Blade to Bottom-Right Handle) -->
        <g transform="translate(175, 175) rotate(-35)">
          <!-- Blade -->
          <polygon points="-8,-92 0,-115 8,-92 6,-30 -6,-30" fill="#FF003C"/>
          <line x1="0" y1="-115" x2="0" y2="-30" stroke="#FCEE09" stroke-width="1.5"/>
          <!-- Crossguard & Handle -->
          <rect x="-18" y="-30" width="36" height="6" rx="2" fill="#FF003C"/>
          <rect x="-5" y="-24" width="10" height="35" rx="2" fill="#FF003C"/>
          <!-- Pommel -->
          <circle cx="0" cy="14" r="7" fill="#FCEE09"/>
        </g>

        <!-- Right Dagger (Top-Right Blade to Bottom-Left Handle) -->
        <g transform="translate(175, 175) rotate(35)">
          <!-- Blade -->
          <polygon points="-8,-92 0,-115 8,-92 6,-30 -6,-30" fill="#FF003C"/>
          <line x1="0" y1="-115" x2="0" y2="-30" stroke="#FCEE09" stroke-width="1.5"/>
          <!-- Crossguard & Handle -->
          <rect x="-18" y="-30" width="36" height="6" rx="2" fill="#FF003C"/>
          <rect x="-5" y="-24" width="10" height="35" rx="2" fill="#FF003C"/>
          <!-- Pommel -->
          <circle cx="0" cy="14" r="7" fill="#FCEE09"/>
        </g>

        <!-- CIRCULAR BROKEN TARGET RING -->
        <path d="M 175 110 A 65 65 0 0 1 240 175 A 65 65 0 0 1 175 240 A 65 65 0 0 1 110 175 A 65 65 0 0 1 175 110" fill="none" stroke="#FF003C" stroke-width="6"/>

        <!-- DEFCON AGGRESSIVE RED SKULL VECTOR -->
        <g transform="translate(175, 170)">
          <!-- Cranium Outer Shape -->
          <path d="M -34 -30 C -34 -55 34 -55 34 -30 C 34 -10 26 5 20 20 L 14 38 L -14 38 L -20 20 C -26 5 -34 -10 -34 -30 Z" fill="#FF003C"/>
          
          <!-- Skull Cracks & Detailing -->
          <path d="M 0 -50 L -6 -35 L 2 -25 L -4 -10" fill="none" stroke="#000000" stroke-width="2"/>
          <path d="M 12 -45 L 8 -32 L 15 -20" fill="none" stroke="#000000" stroke-width="1.5"/>

          <!-- Dark Eye Sockets -->
          <path d="M -22 -18 C -14 -28 -6 -18 -10 -8 C -16 -4 -24 -8 -22 -18 Z" fill="#000000"/>
          <path d="M 22 -18 C 14 -28 6 -18 10 -8 C 16 -4 24 -8 22 -18 Z" fill="#000000"/>
          
          <!-- Glowing Eye Center Dots -->
          <circle cx="-16" cy="-14" r="3" fill="#FCEE09" filter="url(#glow-yellow-intense-light)"/>
          <circle cx="16" cy="-14" r="3" fill="#FCEE09" filter="url(#glow-yellow-intense-light)"/>

          <!-- Triangular Nose Cavity -->
          <polygon points="0,-4 -6,8 6,8" fill="#000000"/>

          <!-- Aggressive Fangs / Teeth Grid -->
          <path d="M -12 24 L -12 40 L -8 24 M -8 24 L -8 42 L -4 24 M -4 24 L 0 44 L 4 24 M 4 24 L 8 42 L 8 24 M 8 24 L 12 40 L 12 24" stroke="#000000" stroke-width="2"/>
        </g>

      </g> <!-- End Skull Anim -->

      <!-- DEFCON & SURRENDER NOTHING STENCIL TEXT -->
      <g transform="translate(175, 272)" text-anchor="middle">
        <!-- DEFCON Title -->
        <text x="0" y="0" fill="#FF003C" class="sans" font-size="25" font-weight="900" letter-spacing="3" filter="url(#glow-red-intense-light)">DEFCON</text>
        <!-- Subtext -->
        <text x="0" y="16" fill="#FCEE09" class="mono" font-size="9" font-weight="800" letter-spacing="2">★ SURRENDER NOTHING ★</text>
      </g>

    </g> <!-- End Logo Graphic Group -->

    <!-- Status Block at Bottom Left -->
    <g transform="translate(18, 335)" class="mono" font-size="10.5">
      <text x="0" y="0" fill="#94A3B8">STATUS  : <tspan fill="#FF003C" font-weight="900" filter="url(#glow-red-intense-light)">● DEFCON 1 [ENGAGED]</tspan></text>
      <text x="0" y="18" fill="#94A3B8">RED TEAM: <tspan fill="#FCEE09" font-weight="800">EXPLOIT &amp; PENTEST OPS</tspan></text>
      <text x="0" y="38" fill="#00FF66" font-weight="800">&gt;_ root@defcon:~# pwn --all<tspan fill="#FF003C" class="cursor-blink"> █</tspan></text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: DEVELOPER PROFILE & RED TEAM DATA (~70%)    -->
  <!-- ======================================================== -->
  <g transform="translate(388, 38)">
    <polygon points="0,12 12,0 750,0 762,12 762,396 750,408 12,408 0,396" fill="#0A0305" fill-opacity="0.95" stroke="#FF003C" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <polygon points="0,12 12,0 750,0 762,12 762,34 0,34" fill="#FF003C"/>
    <circle cx="18" cy="17" r="4.5" fill="#FCEE09"/>
    <circle cx="32" cy="17" r="4.5" fill="#00FF66"/>
    <circle cx="46" cy="17" r="4.5" fill="#000000"/>
    <text x="381" y="21" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="11" font-weight="900" letter-spacing="1">[ DEFCON_PROFILE // BHUVAN_KUMAR_HM ]</text>
    <line x1="0" y1="34" x2="762" y2="34" stroke="#FF003C"/>

    <!-- Content Area -->
    <g transform="translate(28, 52)">
      
      <!-- Name Header with Red/Yellow Gradient -->
      <text x="0" y="22" fill="#94A3B8" class="sans" font-size="15" font-weight="600">Hi 👋, I'm</text>
      <text x="86" y="24" fill="url(#accent-red-yellow-light)" class="sans" font-size="26" font-weight="900" letter-spacing="1">BHUVAN KUMAR H M</text>
      
      <!-- Tagline -->
      <text x="0" y="55" fill="#FF003C" class="mono" font-size="14" font-weight="800">&gt; CYBERSECURITY ENG <tspan fill="#FCEE09">|</tspan> PENETRATION TESTER <tspan fill="#FCEE09">|</tspan> <tspan fill="#FCEE09" font-weight="900">CEH</tspan> <tspan fill="#FCEE09">|</tspan> <tspan fill="#00FF66">AI SECURITY</tspan></text>

      <line x1="0" y1="70" x2="706" y2="70" stroke="rgba(255, 0, 60, 0.3)"/>

      <!-- Clean Non-Overlapping Metadata List -->
      <g transform="translate(0, 96)" class="mono" font-size="13">
        <!-- Row 1: Location -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#FF003C" font-weight="800">[LOC]</text>
          <text x="52" y="0" fill="#FCEE09" font-weight="700">Location    :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">Karnataka, India</text>
        </g>
        <!-- Row 2: Education -->
        <g transform="translate(0, 28)">
          <text x="0" y="0" fill="#FF003C" font-weight="800">[EDU]</text>
          <text x="52" y="0" fill="#FCEE09" font-weight="700">Education   :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">B.E. Computer Science Engineering (Grad 2027)</text>
        </g>
        <!-- Row 3: Credentials -->
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#00FF66" font-weight="800">[SEC]</text>
          <text x="52" y="0" fill="#00FF66" font-weight="700">Credentials :</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">CEH Certified • Pentesting • Reverse Engineering</text>
        </g>
        <!-- Row 4: Focus -->
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#00FF66" font-weight="800">[FOC]</text>
          <text x="52" y="0" fill="#00FF66" font-weight="700">Current Focus:</text>
          <text x="175" y="0" fill="#F8FAFC" font-weight="600">AI Security Research, DuckyBuilder &amp; SOC Automation</text>
        </g>
      </g>

      <line x1="0" y1="210" x2="706" y2="210" stroke="rgba(255, 0, 60, 0.3)"/>

      <!-- Red & Yellow Tech Stack Badges -->
      <g transform="translate(0, 230)">
        <text x="0" y="0" fill="#FF003C" class="mono" font-size="11" font-weight="800" letter-spacing="1.5">// DEFCON_EXPLOIT_STACK &amp; TOOLKIT</text>
        
        <g transform="translate(0, 14)">
          <!-- Python -->
          <polygon points="0,0 72,0 80,8 80,26 8,26 0,18" fill="#1A030A" stroke="#FF003C" stroke-width="1.2"/>
          <text x="40" y="17" text-anchor="middle" fill="#FF003C" class="mono" font-size="10.5" font-weight="800">▶ Python</text>

          <!-- Pentesting -->
          <polygon points="88,0 180,0 188,8 188,26 96,26 88,18" fill="#1C1A04" stroke="#FCEE09" stroke-width="1.2"/>
          <text x="138" y="17" text-anchor="middle" fill="#FCEE09" class="mono" font-size="10.5" font-weight="800">▶ Pentesting</text>

          <!-- Burp Suite -->
