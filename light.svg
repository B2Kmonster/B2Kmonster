        </g>
        <!-- Row 3: Credentials -->
        <g transform="translate(0, 52)">
          <text x="0" y="0" fill="#059669" font-weight="700">🎯  Credentials :</text>
          <text x="145" y="0" fill="#0F172A" font-weight="600">CEH Certified • Pentesting • Reverse Engineering</text>
        </g>
        <!-- Row 4: Focus -->
        <g transform="translate(0, 78)">
          <text x="0" y="0" fill="#B45309" font-weight="700">⚡  Current Focus:</text>
          <text x="145" y="0" fill="#0F172A" font-weight="600">AI Security Research, DuckyBuilder &amp; SOC Automation</text>
        </g>
      </g>

      <line x1="0" y1="202" x2="712" y2="202" stroke="#E2E8F0"/>

      <!-- Tech Skills Grid -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#475569" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">// TECH &amp; SECURITY STACK</text>
        
        <g transform="translate(0, 14)">
          <!-- Python -->
          <rect x="0" y="0" width="76" height="26" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
          <text x="38" y="17" text-anchor="middle" fill="#0369A1" class="mono" font-size="11" font-weight="700">Python</text>

          <!-- Pentesting -->
          <rect x="84" y="0" width="94" height="26" rx="6" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.2"/>
          <text x="131" y="17" text-anchor="middle" fill="#6B21A8" class="mono" font-size="11" font-weight="700">Pentesting</text>

          <!-- Burp Suite -->
          <rect x="186" y="0" width="94" height="26" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
          <text x="233" y="17" text-anchor="middle" fill="#C2410C" class="mono" font-size="11" font-weight="700">Burp Suite</text>

          <!-- AI Security -->
          <rect x="288" y="0" width="96" height="26" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.2"/>
          <text x="336" y="17" text-anchor="middle" fill="#0E7490" class="mono" font-size="11" font-weight="700">AI Security</text>

          <!-- Wazuh SIEM -->
          <rect x="392" y="0" width="102" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
          <text x="443" y="17" text-anchor="middle" fill="#047857" class="mono" font-size="11" font-weight="700">Wazuh SIEM</text>

          <!-- Docker -->
          <rect x="502" y="0" width="72" height="26" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
          <text x="538" y="17" text-anchor="middle" fill="#0369A1" class="mono" font-size="11" font-weight="700">Docker</text>

          <!-- Linux -->
