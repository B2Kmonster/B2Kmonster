<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470">
  <defs>
    <!-- Dark Cyberpunk Background Base -->
    <linearGradient id="cyber-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020305"/>
      <stop offset="50%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#030205"/>
    </linearGradient>

    <!-- Neon Green & Cyber Red Gradient -->
    <linearGradient id="cyber-neon-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66; #FF0055; #00F0FF; #00FF66" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055; #00F0FF; #00FF66; #FF0055" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF; #00FF66; #FF0055; #00F0FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Cyberpunk Outer Border Shimmer -->
    <linearGradient id="cyber-border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="35%" stop-color="#FF0055"/>
      <stop offset="70%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <!-- Hexagonal Background Grid Pattern -->
    <pattern id="hex-pattern-light" width="24" height="41.569" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6.928 L 24 20.785 L 12 27.713 L 0 20.785 L 0 6.928 Z M 0 41.569 L 12 34.641 L 24 41.569" fill="none" stroke="rgba(0, 255, 102, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="glow-green-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-red-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyber-shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Background Radial Blobs -->
    <radialGradient id="blob-green-light" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-red-light" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Source Code Pro', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes laserSweep { 0% { transform: translateY(0px); } 100% { transform: translateY(470px); } }
    @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes bgPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1.0; } }
    @keyframes glitchText { 0%, 100% { transform: translate(0, 0); } 92% { transform: translate(1px, -1px); } 94% { transform: translate(-1px, 1px); } }

    .cursor-blink { animation: blink 0.8s infinite; }
    .laser-beam { animation: laserSweep 5s linear infinite; }
    .hud-cw { transform-origin: 175px 190px; animation: rotateClockwise 18s linear infinite; }
    .hud-ccw { transform-origin: 175px 190px; animation: rotateCounter 12s linear infinite; }
    .bg-pulse { animation: bgPulse 5s ease-in-out infinite; }
    .glitch-effect { animation: glitchText 4s infinite; }
  </style>

  <!-- Outer Cyber Outer Chamfered Container -->
  <polygon points="0,20 20,0 1160,0 1180,20 1180,450 1160,470 20,470 0,450" fill="url(#cyber-bg-light)" stroke="url(#cyber-border-light)" stroke-width="2" filter="url(#cyber-shadow-light)"/>

  <!-- Hexagonal Grid Overlay -->
  <rect x="0" y="0" width="1180" height="470" fill="url(#hex-pattern-light)"/>

  <!-- Background Pulsing Radial Glow Blobs -->
  <g class="bg-pulse">
    <circle cx="180" cy="120" r="280" fill="url(#blob-green-light)"/>
    <circle cx="1000" cy="340" r="300" fill="url(#blob-red-light)"/>
  </g>

  <!-- Top Cyber Ticker Line -->
  <g transform="translate(24, 18)" class="mono" font-size="10" font-weight="700">
    <text x="0" y="0" fill="#00FF66" letter-spacing="1.5">// CLASSIFIED_SECURITY_NODE // AGENT: B2KMONSTER // OP: RED_TEAM // SYS: KALI_LINUX_PRO</text>
    <text x="1132" y="0" text-anchor="end" fill="#FF0055" letter-spacing="1">● SEC_LEVEL: MAXIMUM</text>
  </g>

  <!-- Dual Laser Sweep Beams -->
  <rect x="0" y="0" width="1180" height="3" fill="#00FF66" opacity="0.6" class="laser-beam" filter="url(#glow-green-light)"/>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: NETRUNNER HUD & CYBER VISOR (~30%)         -->
  <!-- ======================================================== -->
  <g transform="translate(24, 34)">
    <!-- Chamfered Panel Container -->
    <polygon points="0,12 12,0 338,0 350,12 350,400 338,412 12,412 0,400" fill="#070C0A" fill-opacity="0.92" stroke="rgba(0, 255, 102, 0.35)" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <polygon points="0,12 12,0 338,0 350,12 350,34 0,34" fill="#0E1712"/>
    <circle cx="18" cy="17" r="4.5" fill="#FF0055"/>
    <circle cx="32" cy="17" r="4.5" fill="#FFB700"/>
    <circle cx="46" cy="17" r="4.5" fill="#00FF66"/>
    <text x="175" y="21" text-anchor="middle" fill="#00FF66" class="mono" font-size="11" font-weight="700" letter-spacing="1">[ NETRUNNER_NODE_01 ]</text>
    <line x1="0" y1="34" x2="350" y2="34" stroke="rgba(0, 255, 102, 0.25)"/>

    <!-- Central Cyberpunk Emblem Graphic -->
    <g transform="translate(175, 190)">
      <!-- Outer Hex Reticle -->
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#00FF66" stroke-width="1" stroke-dasharray="6 6" class="hud-cw"/>
      <circle cx="0" cy="0" r="76" fill="none" stroke="#FF0055" stroke-width="1.5" stroke-dasharray="14 8" class="hud-ccw"/>

      <!-- Crosshairs -->
      <line x1="-100" y1="0" x2="-65" y2="0" stroke="#00FF66" stroke-width="2"/>
      <line x1="65" y1="0" x2="100" y2="0" stroke="#00FF66" stroke-width="2"/>
      <line x1="0" y1="-100" x2="0" y2="-65" stroke="#00FF66" stroke-width="2"/>
      <line x1="0" y1="65" x2="0" y2="100" stroke="#00FF66" stroke-width="2"/>

      <!-- Cyber Visor Skull Geometry -->
      <polygon points="-40,-30 40,-30 50,-5 30,30 -30,30 -50,-5" fill="#050A08" stroke="#00FF66" stroke-width="2.5" filter="url(#glow-green-light)"/>
      <polygon points="-32,-18 32,-18 40,-2 22,14 -22,14 -40,-2" fill="#FF0055" fill-opacity="0.85" stroke="#FF0055" stroke-width="1.5" filter="url(#glow-red-light)"/>
      <path d="M -18 30 L -18 44 M -6 30 L -6 44 M 6 30 L 6 44 M 18 30 L 18 44" stroke="#00FF66" stroke-width="2"/>

      <!-- Angular Corner Brackets -->
      <path d="M -60 -50 L -70 -50 L -70 -40" fill="none" stroke="#00FF66" stroke-width="2"/>
      <path d="M 60 -50 L 70 -50 L 70 -40" fill="none" stroke="#00FF66" stroke-width="2"/>
      <path d="M -60 50 L -70 50 L -70 40" fill="none" stroke="#00FF66" stroke-width="2"/>
      <path d="M 60 50 L 70 50 L 70 40" fill="none" stroke="#00FF66" stroke-width="2"/>
    </g>

    <!-- Cyber Telemetry Output Block -->
    <g transform="translate(18, 332)" class="mono" font-size="10.5">
      <text x="0" y="0" fill="#94A3B8">STATUS  : <tspan fill="#00FF66" font-weight="800" filter="url(#glow-green-light)">● ONLINE [100% OK]</tspan></text>
      <text x="0" y="18" fill="#94A3B8">LAB_NODES: <tspan fill="#00F0FF" font-weight="700">Wazuh SIEM • n8n • AD DC</tspan></text>
      <text x="0" y="36" fill="#94A3B8">EXPLOITS: <tspan fill="#FF0055" font-weight="800" filter="url(#glow-red-light)">WarePy • DuckyBuilder</tspan></text>
      <text x="0" y="56" fill="#00FF66" font-weight="800">&gt;_ root@b2ksec:~# exploit -t AI<tspan fill="#FF0055" class="cursor-blink"> █</tspan></text>
    </g>
  </g>

