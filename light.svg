    <!-- Chamfered Panel Container -->
    <polygon points="0,12 12,0 750,0 762,12 762,400 750,412 12,412 0,400" fill="#070A0E" fill-opacity="0.92" stroke="rgba(0, 255, 102, 0.35)" stroke-width="1.5"/>
    
